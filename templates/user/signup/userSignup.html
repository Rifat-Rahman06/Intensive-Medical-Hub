<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - Intensive Medical Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/static/css/user-signup.css">
</head>
<body>
  <div class="signup-container">
    <div class="signup-header">
      <div class="brand-logo"><i class="fa fa-user-plus"></i></div>
      <h1>Create User Account</h1>
      <p class="subtitle">Join Intensive Medical Hub & Blood Donation Network</p>
    </div>

    <form id="signupForm" class="signup-form">
      <div class="avatar-upload">
        <div class="avatar-preview">
          <img id="imgPreview" src="/static/images/profile.svg" alt="Profile Preview">
        </div>
        <label for="profilePicture" class="btn-upload"><i class="fa fa-camera"></i> Choose Picture</label>
        <input type="file" id="profilePicture" name="profile_picture" accept="image/*" onchange="previewImage(event)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="first_name" placeholder="John" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="last_name" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>
        <div class="form-group">
          <label for="bloodGroup">Blood Group</label>
          <select id="bloodGroup" name="blood_group" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" name="phone_number" placeholder="01700000000" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>

      <button type="button" class="btn-primary" onclick="signup()">
        <i class="fa fa-check-circle"></i> Register Account
      </button>
    </form>

    <div class="signup-footer">
      <p>Already registered? <a href="/user/login/userLogin.html">Log In</a></p>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon"><i class="fa fa-check-circle"></i></div>
      <h2>Registration Successful!</h2>
      <p>Your account has been created. Please save your User ID for future logins:</p>
      <div class="user-id-badge">
        <span>User ID:</span> <strong id="assignedId">#000</strong>
      </div>
      <button class="btn-primary" onclick="goToLogin()">Proceed to Login</button>
    </div>
  </div>

  <script src="/static/js/user-signup.js"></script>
</body>
</html>
