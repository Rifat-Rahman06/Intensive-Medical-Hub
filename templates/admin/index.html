<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Intensive Medical Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <!-- Header -->
  <header class="admin-header">
    <div class="header-left">
      <div class="brand-logo"><i class="fa fa-user-md"></i></div>
      <div class="brand-title">
        <h1 id="hospitalNameHeader">Hospital Admin</h1>
        <span>Intensive Medical Hub Management</span>
      </div>
    </div>

    <nav class="admin-nav">
      <button id="navWardBtn" class="nav-btn active" onclick="switchSection('ward')">
        <i class="fa fa-bed"></i> Wards
      </button>
      <button id="navTestBtn" class="nav-btn" onclick="switchSection('test')">
        <i class="fa fa-flask"></i> Tests
      </button>
      <button id="navDoctorBtn" class="nav-btn" onclick="switchSection('doctor')">
        <i class="fa fa-user-md"></i> Doctors
      </button>
      <button id="navBloodBtn" class="nav-btn" onclick="switchSection('blood')">
        <i class="fa fa-tint"></i> Blood Requests
      </button>
    </nav>

    <div class="header-right">
      <button class="btn-profile" onclick="openProfileModal()">
        <i class="fa fa-cog"></i> Hospital Profile
      </button>
      <button class="logout-btn" onclick="logout()">
        <i class="fa fa-sign-out"></i>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="admin-layout">
    <!-- Action Bar -->
    <div class="action-bar">
      <h2 id="sectionTitle">Ward Management</h2>
      <button id="addBtn" class="btn-add" onclick="openAddForm()">
        <i class="fa fa-plus-circle"></i> Add New Ward
      </button>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="cards-grid"></div>
  </main>

  <!-- Modal 1: Ward Form -->
  <div id="wardModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="wardModalTitle">Add Ward</h3>
        <button class="close-btn" onclick="closeModal('wardModal')">&times;</button>
      </div>
      <form id="wardForm">
        <input type="hidden" id="wardId" name="id">
        <div class="form-group">
          <label>Ward Type</label>
          <input type="text" id="wardType" name="ward_type" placeholder="e.g. Pediatric Ward" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Total Capacity (Beds)</label>
            <input type="number" id="wardCapacity" name="capacity" min="1" required>
          </div>
          <div class="form-group">
            <label>Occupied Beds</label>
            <input type="number" id="wardOccupied" name="available" min="0" required>
          </div>
        </div>
        <div class="form-group">
          <label>Cost Per Day (৳)</label>
          <input type="number" id="wardCost" name="cost_per_day" required>
        </div>
        <div class="form-group">
          <label>Description / About</label>
          <textarea id="wardAbout" name="about" rows="3" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('wardModal')">Cancel</button>
          <button type="button" class="btn-save" onclick="saveWard()">Save Ward</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Doctor Form -->
  <div id="doctorModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="doctorModalTitle">Add Doctor</h3>
        <button class="close-btn" onclick="closeModal('doctorModal')">&times;</button>
      </div>
      <form id="doctorForm">
        <input type="hidden" id="doctorId" name="id">
        <div class="avatar-upload">
          <img id="doctorPreview" src="/static/images/profile.svg" alt="Doctor Avatar">
          <label for="doctorPicInput" class="avatar-label"><i class="fa fa-camera"></i> Doctor Picture</label>
          <input type="file" id="doctorPicInput" name="profile_picture" accept="image/*" onchange="previewDocImg(event)">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="docFirstName" name="first_name" required>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="docLastName" name="last_name" required>
          </div>
        </div>
        <div class="form-group">
          <label>Specialty</label>
          <select id="docSpecialty" name="specialty" required></select>
        </div>
        <div class="form-group">
          <label>Doctor Bio / About</label>
          <textarea id="docAbout" name="about" rows="3" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('doctorModal')">Cancel</button>
          <button type="button" class="btn-save" onclick="saveDoctor()">Save Doctor</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 3: Test Form -->
  <div id="testModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="testModalTitle">Add Diagnostic Test</h3>
        <button class="close-btn" onclick="closeModal('testModal')">&times;</button>
      </div>
      <form id="testForm">
        <input type="hidden" id="testOldName" name="old_name">
        <div class="form-group">
          <label>Test Name</label>
          <input type="text" id="testName" name="name" placeholder="e.g. ECG 12-Lead" required>
        </div>
        <div class="form-group">
          <label>Cost (৳)</label>
          <input type="number" id="testCost" name="cost" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="testDesc" name="description" rows="3" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('testModal')">Cancel</button>
          <button type="button" class="btn-save" onclick="saveTest()">Save Test</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 4: Blood Request Form & Donors List -->
  <div id="bloodModal" class="modal-overlay" style="display: none;">
    <div class="modal-card modal-wide">
      <div class="modal-header">
        <h3 id="bloodModalTitle">Blood Request Management</h3>
        <button class="close-btn" onclick="closeModal('bloodModal')">&times;</button>
      </div>
      <form id="bloodForm">
        <input type="hidden" id="bloodId" name="id">
        <div class="form-row">
          <div class="form-group">
            <label>Blood Group</label>
            <select id="bloodGroupSelect" name="blood_group" required>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantity Needed (Bags)</label>
            <input type="number" id="bloodQty" name="quantity" min="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Required Date</label>
            <input type="date" id="bloodDate" name="date" required>
          </div>
          <div class="form-group">
            <label>Required Time</label>
            <input type="text" id="bloodTime" name="time" placeholder="10:30 AM" required>
          </div>
        </div>
        <div class="form-group">
          <label>Reason / Description</label>
          <textarea id="bloodDesc" name="description" rows="2" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('bloodModal')">Cancel</button>
          <button type="button" class="btn-save" onclick="saveBlood()">Save Request</button>
        </div>
      </form>

      <!-- Interested Donors Table Section -->
      <div id="donorsSection" class="donors-section" style="display: none;">
        <h4><i class="fa fa-heartbeat text-danger"></i> Registered Interested Donors</h4>
        <div class="table-responsive">
          <table class="donors-table">
            <thead>
              <tr>
                <th>Donor</th>
                <th>Blood Group</th>
                <th>Age</th>
                <th>Phone Number</th>
              </tr>
            </thead>
            <tbody id="donorsList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal 5: Hospital Profile Settings -->
  <div id="profileModal" class="modal-overlay" style="display: none;">
    <div class="modal-card modal-wide">
      <div class="modal-header">
        <h3>Hospital Settings & Location Pinning</h3>
        <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
      </div>

      <form id="hospitalProfileForm">
        <div class="profile-layout">
          <div class="profile-inputs">
            <div class="avatar-upload">
              <img id="hospitalPreview" src="/static/images/hospital.svg" alt="Hospital">
              <label for="hosImgInput" class="avatar-label"><i class="fa fa-camera"></i> Hospital Image</label>
              <input type="file" id="hosImgInput" name="image" accept="image/*" onchange="previewHosImg(event)">
            </div>

            <div class="form-group">
              <label>Hospital Name</label>
              <input type="text" id="hosName" name="name" required>
            </div>

            <div class="form-group">
              <label>Contact Hotline</label>
              <input type="text" id="hosContact" name="contact_no" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Ownership Type</label>
                <select id="hosType" name="type">
                  <option value="public">Public</option>
                  <option value="private">Private</option>
                </select>
              </div>

              <div class="form-group">
                <label>Emergency Unit</label>
                <select id="hosEmergency" name="emergency_units">
                  <option value="1">24/7 Available</option>
                  <option value="0">Not Available</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Latitude</label>
                <input type="text" id="hosLat" name="latitude" readonly required>
              </div>
              <div class="form-group">
                <label>Longitude</label>
                <input type="text" id="hosLng" name="longitude" readonly required>
              </div>
            </div>
          </div>

          <!-- Map for Pinning Location -->
          <div class="profile-map-box">
            <div class="map-bar">
              <span>Click map to pin hospital location</span>
              <button type="button" class="btn-sm" onclick="setMapToMyLocation()"><i class="fa fa-crosshairs"></i> My Location</button>
            </div>
            <div id="profileMap" class="map-container-sm"></div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('profileModal')">Cancel</button>
          <button type="button" class="btn-save" onclick="saveHospitalProfile()">Save Hospital Settings</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
